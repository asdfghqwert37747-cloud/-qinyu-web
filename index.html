<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>寝室治愈小屋</title>
<!--
  ============================================================
  部署说明（Vercel + 中转代理，解决跨域与超时）
  ============================================================
  本页面调用同域的中转代理：
    /api/proxy
  代理文件位于 api/proxy.js（Vercel Serverless Function），由它转发到
  Coze /run 接口，并在服务端附带 Token（Token 内置在 api/proxy.js）。
  函数超时设为 60 秒，以容纳完整多 Agent 工作流（约 27 秒）。

  Vercel 部署步骤（详见说明）：
  1. 项目结构：index.html + api/proxy.js
  2. 用 Vercel CLI（vercel deploy）或 GitHub 导入方式部署。
  ============================================================
-->
<style>
  :root {
    --bg: #fdf6ef;
    --primary: #ff8f5e;
    --primary-soft: #ffd9c2;
    --assistant-bubble: #ffffff;
    --text: #4a3b32;
    --text-light: #8a7a70;
    --border: #f0e2d4;
    --shadow: 0 2px 12px rgba(180, 130, 90, 0.10);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: linear-gradient(160deg, #fff7ef 0%, #ffeede 100%);
    color: var(--text);
    display: flex;
    justify-content: center;
  }
  .app {
    width: 100%;
    max-width: 520px;
    height: 100vh;
    height: 100dvh;
    display: flex;
    flex-direction: column;
    background: var(--bg);
    box-shadow: 0 0 30px rgba(180, 130, 90, 0.12);
    position: relative;
  }
  /* 顶部标题栏 */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: rgba(255, 255, 255, 0.9);
    border-bottom: 1px solid var(--border);
    position: sticky;
    top: 0;
    z-index: 10;
  }
  .logo { font-size: 17px; font-weight: 600; letter-spacing: .5px; }
  .reset-btn {
    border: 1px solid var(--primary-soft);
    background: #fff;
    color: var(--primary);
    border-radius: 16px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
  }
  .reset-btn:active { background: var(--primary-soft); }
  /* 聊天区域 */
  .chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg { display: flex; }
  .msg.user { justify-content: flex-end; }
  .msg.assistant { justify-content: flex-start; }
  .bubble {
    max-width: 82%;
    padding: 11px 14px;
    border-radius: 16px;
    font-size: 15px;
    line-height: 1.6;
    word-break: break-word;
    white-space: pre-wrap;
  }
  .msg.user .bubble {
    background: var(--primary);
    color: #fff;
    border-bottom-right-radius: 4px;
    box-shadow: var(--shadow);
  }
  .msg.assistant .bubble {
    background: var(--assistant-bubble);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
    box-shadow: var(--shadow);
  }
  /* 打字中动画 */
  .typing { display: inline-flex; gap: 4px; padding: 14px 16px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--text-light);
    animation: blink 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: .2s; }
  .typing span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 80%, 100% { opacity: .25; } 40% { opacity: 1; } }
  /* 角色卡片 */
  .cards {
    padding: 4px 14px 12px;
    display: flex;
    gap: 10px;
    overflow-x: auto;
    border-top: 1px dashed var(--border);
  }
  .card {
    min-width: 96px;
    flex: 1;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 12px 8px;
    text-align: center;
    cursor: pointer;
    transition: transform .12s ease, box-shadow .12s ease;
    box-shadow: var(--shadow);
  }
  .card:active { transform: scale(.96); }
  .card .emoji { font-size: 26px; display: block; margin-bottom: 6px; }
  .card .name { font-size: 13px; font-weight: 600; }
  .card .desc { font-size: 11px; color: var(--text-light); margin-top: 3px; }
  /* 底部输入区 */
  .footer {
    display: flex;
    gap: 10px;
    padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
    background: rgba(255, 255, 255, 0.95);
    border-top: 1px solid var(--border);
  }
  .footer input {
    flex: 1;
    border: 1px solid var(--border);
    border-radius: 20px;
    padding: 11px 16px;
    font-size: 15px;
    outline: none;
    background: #fff;
    color: var(--text);
  }
  .footer input:focus { border-color: var(--primary); }
  .footer button {
    border: none;
    background: var(--primary);
    color: #fff;
    border-radius: 20px;
    padding: 0 22px;
    font-size: 15px;
    cursor: pointer;
  }
  .footer button:active { opacity: .85; }
  .footer button:disabled { background: #e8cfc0; }
  /* 错误提示气泡 */
  .msg.assistant .bubble.error { background: #fff0f0; border-color: #f5c6c6; color: #c0392b; }
</style>
</head>
<body>
<div class="app">
  <header class="header">
    <span class="logo">🌙 寝室治愈小屋</span>
    <button class="reset-btn" id="resetBtn">重新选择角色</button>
  </header>

  <main class="chat" id="chat"></main>

  <div class="cards" id="cards" style="display:none;"></div>

  <footer class="footer">
    <input type="text" id="input" placeholder="和我说说你的心事…" autocomplete="off" />
    <button id="sendBtn">发送</button>
  </footer>
</div>

<script>
// ================= 配置区 =================
const API_URL = '/api/proxy';   // 同域代理地址（Vercel Function），部署后无需改
// =========================================

const LS_MESSAGES = 'qinyu_messages';
const LS_PERSONA = 'qinyu_persona';

const PERSONAS = [
  { name: '热心学长', emoji: '🔅', desc: '真诚可靠' },
  { name: '知心学姐', emoji: '💫', desc: '温柔倾听' },
  { name: '心理专家', emoji: '🎶', desc: '专业引导' },
  { name: '温柔老师', emoji: '🍦', desc: '温和陪伴' },
];

const chatEl = document.getElementById('chat');
const cardsEl = document.getElementById('cards');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('sendBtn');
const resetBtn = document.getElementById('resetBtn');

let messages = [];      // [{role:'user'|'assistant', text, error?}]
let persona = '';
let busy = false;

// ---------- 存储 ----------
function loadState() {
  try { messages = JSON.parse(localStorage.getItem(LS_MESSAGES)) || []; }
  catch (e) { messages = []; }
  persona = localStorage.getItem(LS_PERSONA) || '';
}
function saveMessages() {
  localStorage.setItem(LS_MESSAGES, JSON.stringify(messages));
}
function savePersona(p) {
  persona = p || '';
  if (persona) localStorage.setItem(LS_PERSONA, persona);
  else localStorage.removeItem(LS_PERSONA);
}
function buildHistory() {
  return messages
    .filter(m => !m.error)
    .map(m => (m.role === 'user' ? '用户：' : '助手：') + m.text)
    .join('\n');
}

// ---------- 渲染 ----------
function addMessage(role, text, opts) {
  const msg = Object.assign({ role, text }, opts || {});
  messages.push(msg);
  saveMessages();
  renderMessage(msg);
}
function renderMessage(msg) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + msg.role;
  const bubble = document.createElement('div');
  bubble.className = 'bubble' + (msg.error ? ' error' : '');
  bubble.textContent = msg.text;
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  scrollToBottom();
}
function showTyping() {
  const wrap = document.createElement('div');
  wrap.className = 'msg assistant';
  wrap.id = 'typing';
  const bubble = document.createElement('div');
  bubble.className = 'bubble typing';
  bubble.innerHTML = '<span></span><span></span><span></span>';
  wrap.appendChild(bubble);
  chatEl.appendChild(wrap);
  scrollToBottom();
}
function hideTyping() {
  const t = document.getElementById('typing');
  if (t) t.remove();
}
function scrollToBottom() {
  chatEl.scrollTop = chatEl.scrollHeight;
}

// ---------- 角色卡片 ----------
function renderCards() {
  cardsEl.innerHTML = '';
  PERSONAS.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = '<span class="emoji">' + p.emoji + '</span>' +
                     '<div class="name">' + p.name + '</div>' +
                     '<div class="desc">' + p.desc + '</div>';
    card.onclick = () => selectPersona(p.name);
    cardsEl.appendChild(card);
  });
  cardsEl.style.display = 'flex';
}
function hideCards() {
  cardsEl.style.display = 'none';
}

// ---------- 接口调用 ----------
async function callApi(userInput, history, persona) {
  const controller = new AbortController();
  const timer = setTimeout(() => controller.abort(), 120000);
  try {
    const resp = await fetch(API_URL, {
      method: 'POST',
      signal: controller.signal,
      headers: {
        'Content-Type': 'application/json',
      },
      body: JSON.stringify({
        user_input: userInput,
        history: history || '',
        persona: persona || '',
      }),
    });
    if (!resp.ok) {
      throw new Error('HTTP ' + resp.status);
    }
    const data = await resp.json();
    // 兼容可能的包装层
    const inner = data && typeof data === 'object' ? data : {};
    const reply = inner.final_reply !== undefined ? inner.final_reply
      : ((inner.output && inner.output.final_reply !== undefined) ? inner.output.final_reply : '');
    const p = inner.persona !== undefined ? inner.persona
      : ((inner.output && inner.output.persona !== undefined) ? inner.output.persona : '');
    return { reply: String(reply || ''), persona: String(p || '') };
  } finally {
    clearTimeout(timer);
  }
}

// ---------- 业务 ----------
async function send(text) {
  if (busy) return;
  const content = (text || inputEl.value).trim();
  if (!content) return;
  inputEl.value = '';
  busy = true;
  sendBtn.disabled = true;

  addMessage('user', content);
  const history = buildHistory();
  showTyping();
  try {
    const { reply, persona: p } = await callApi(content, history, persona);
    hideTyping();
    if (reply) addMessage('assistant', reply);
    else addMessage('assistant', '（收到啦，但我好像没听清，再和我说一次好吗？）');
    if (p) savePersona(p);
    if (persona) hideCards();
  } catch (e) {
    hideTyping();
    addMessage('assistant', '（网络开小差啦，请稍后重试～）', { error: true });
  } finally {
    busy = false;
    sendBtn.disabled = false;
    inputEl.focus();
    scrollToBottom();
  }
}

async function selectPersona(name) {
  if (busy) return;
  busy = true;
  sendBtn.disabled = true;
  const history = buildHistory();
  hideCards();
  showTyping();
  try {
    const { reply, persona: p } = await callApi(name, history, '');
    hideTyping();
    if (reply) addMessage('assistant', reply);
    if (p) savePersona(p);
  } catch (e) {
    hideTyping();
    addMessage('assistant', '（网络开小差啦，请稍后重试～）', { error: true });
    renderCards();
  } finally {
    busy = false;
    sendBtn.disabled = false;
    scrollToBottom();
  }
}

async function resetAll() {
  if (busy) return;
  messages = [];
  persona = '';
  saveMessages();
  savePersona('');
  chatEl.innerHTML = '';
  showTyping();
  try {
    const { reply } = await callApi('你好', '', '');
    hideTyping();
    if (reply) addMessage('assistant', reply);
    renderCards();
  } catch (e) {
    hideTyping();
    addMessage('assistant', '（网络开小差啦，请稍后重试～）', { error: true });
  }
}

// ---------- 事件 ----------
sendBtn.onclick = () => send();
inputEl.addEventListener('keydown', e => { if (e.key === 'Enter') send(); });
resetBtn.onclick = resetAll;

// ---------- 初始化 ----------
(function init() {
  loadState();
  // 恢复历史消息
  messages.forEach(m => renderMessage(m));
  if (messages.length === 0) {
    // 新会话：调接口拿开场白
    (async () => {
      showTyping();
      try {
        const { reply } = await callApi('你好', '', '');
        hideTyping();
        if (reply) addMessage('assistant', reply);
        renderCards();
      } catch (e) {
        hideTyping();
        addMessage('assistant', '（网络开小差啦，请稍后重试～）', { error: true });
      }
    })();
  } else {
    // 已有历史：若还没选角色，显示角色卡片
    if (!persona) renderCards();
  }
})();
</script>
</body>
</html>
